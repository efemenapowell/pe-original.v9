# ============================================================
# PE_ORIGINALS — Full local stack
#   app (Express + Prisma) · postgres · redis
#
#   docker compose up -d --build
#   → storefront + admin on http://localhost:5000
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: pe_originals_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pe_originals
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pe_originals_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: pe_originals_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pe_originals?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000}
      PUBLIC_URL: http://localhost:5000
      MAIL_DEV_MODE: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@peoriginals.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe_12345}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/backend/uploads

volumes:
  pgdata:
  redisdata:
  uploads:
