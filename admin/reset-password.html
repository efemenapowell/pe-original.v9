<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — PE_ORIGINALS Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand-mark">PE</span>
      <h1>Set New Password</h1>
      <p class="auth-sub">Choose a strong password to continue.</p>
    </div>

    <form id="resetForm" class="auth-form" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="8" placeholder="At least 8 characters" />
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" required minlength="8" placeholder="Repeat password" />
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Reset password</button>
      <p class="form-error" id="formError" role="alert"></p>
      <p class="form-success" id="formSuccess" role="status"></p>
    </form>

    <p class="auth-foot"><a href="login.html" class="link">← Back to sign in</a></p>
  </main>

  <script src="js/admin-api.js"></script>
  <script src="js/reset.js"></script>
</body>
</html>
