<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — PE_ORIGINALS</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand-mark">PE</span>
      <h1>PE_ORIGINALS</h1>
      <p class="auth-sub">Store Admin</p>
    </div>

    <!-- Login form -->
    <form id="loginForm" class="auth-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required placeholder="admin@peoriginals.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••" />
      </div>
      <div class="auth-row">
        <label class="checkbox">
          <input type="checkbox" id="remember" /> Remember me
        </label>
        <a href="forgot-password.html" class="link">Forgot password?</a>
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
      <p class="form-error" id="formError" role="alert"></p>
    </form>

    <p class="auth-foot">Protected area — authorised personnel only.</p>
  </main>

  <script src="js/admin-api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
