<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account — PE_ORIGINALS</title>
  <meta name="description" content="Your PE_ORIGINALS account — orders, profile, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Dancing+Script:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <style>
    /* Account page additions (thin layer on top of style.css) */
    .account-page { padding: 40px 0 80px; }
    .account-head { text-align: center; margin-bottom: 34px; }
    .account-head h1 { font-family: 'Playfair Display', serif; font-size: clamp(28px, 4vw, 38px); }
    .account-head p { color: var(--ink-500, #8a7a84); }
    .account-layout { display: grid; grid-template-columns: 260px 1fr; gap: 28px; max-width: 1080px; margin: 0 auto; padding: 0 20px; }
    .account-nav { display: grid; gap: 8px; align-content: start; }
    .account-nav button {
      text-align: left; padding: 13px 16px; border: 1.5px solid var(--line, #f0e2ea);
      border-radius: 12px; background: #fff; font-family: inherit; font-size: 14px; font-weight: 500;
      color: var(--ink-700, #4a3a44); cursor: pointer; transition: all .15s;
    }
    .account-nav button.active { border-color: var(--pink, #c75b8c); color: var(--pink, #c75b8c); background: #fdf2f7; }
    .account-panel { min-width: 0; }
    .orders-list { display: grid; gap: 14px; }
    .order-card { border: 1.5px solid var(--line, #f0e2ea); border-radius: 16px; padding: 18px 20px; background: #fff; }
    .order-card .oc-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .order-card .oc-num { font-weight: 700; }
    .order-card .oc-status { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
    .order-card .oc-items { font-size: 13px; color: var(--ink-500, #8a7a84); margin-bottom: 8px; }
    .order-card .oc-total { font-weight: 600; }
    .status-PENDING { background: #fdf3e3; color: #b7791f; }
    .status-PAID { background: #e8f4ee; color: #2e8b57; }
    .status-SHIPPED { background: #e3eefa; color: #1d6fb8; }
    .status-DELIVERED { background: #e8f0fe; color: #4c51bf; }
    .status-CANCELLED { background: #fdecea; color: #c0392b; }
    .profile-form { max-width: 460px; display: grid; gap: 14px; }
    .profile-form input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line, #f0e2ea); border-radius: 12px; font-family: inherit; }
    .auth-required { text-align: center; padding: 60px 20px; }
    .auth-required .icon { font-size: 48px; margin-bottom: 10px; }
    @media (max-width: 760px) { .account-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <img src="images/logo.png" alt="PE_ORIGINALS logo" class="brand-logo" onerror="this.style.display='none'" />
        <span class="brand-text">PE_<em>ORIGINALS</em></span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="nav-icons">
        <button class="icon-btn" aria-label="My account" data-open-auth>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" /></svg>
        </button>
        <button class="icon-btn" aria-label="Open shopping bag" data-open-cart>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h12l1.5 13.5h-15L6 7z" /><path d="M9 10V6a3 3 0 016 0v4" /></svg>
          <span class="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="account-page">
    <div class="account-head">
      <h1>My Account</h1>
      <p id="acctGreeting">Welcome back</p>
    </div>
    <div id="acctRoot"></div>
  </main>

  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="Shopping bag">
    <div class="cart-head"><h3>Your Bag <span id="cartCountLabel">0 items</span></h3>
      <button class="cart-close" data-close-cart aria-label="Close cart">×</button></div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-empty" id="cartEmpty"><p>Your bag is empty.</p><a href="shop.html" class="btn btn-outline">Shop new pieces</a></div>
    <div class="cart-footer" id="cartFooter">
      <div class="cart-free-ship" id="shipNote"></div>
      <span class="ship-bar"><span id="shipBar"></span></span>
      <div class="cart-total-row"><span>Subtotal</span><span id="cartSubtotal">₦0</span></div>
      <div class="cart-total-row total"><span>Total</span><span class="amount" id="cartTotal">₦0</span></div>
      <button class="btn btn-block" data-checkout>Checkout</button>
    </div>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/api.js"></script>
  <script src="js/api-bootstrap.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/store-config.js"></script>
  <script src="js/paystack-inline.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/account.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
