<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — PE_ORIGINALS</title>
  <meta name="description" content="Set a new password for your PE_ORIGINALS account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Dancing+Script:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    .reset-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(900px 500px at 85% -10%, #fce7f0 0%, transparent 60%), #faf7f9; }
    .reset-card { width: 100%; max-width: 420px; background: #fff; border: 1.5px solid #f0e2ea; border-radius: 20px; padding: 36px 32px; box-shadow: 0 20px 50px rgba(180,74,116,.08); }
    .reset-card h1 { font-family: 'Playfair Display', serif; font-size: 26px; text-align: center; margin-bottom: 4px; }
    .reset-card .sub { text-align: center; color: #8a7a84; font-size: 14px; margin-bottom: 24px; }
    .reset-card label { display: block; font-size: 13px; font-weight: 500; color: #4a3a44; margin-bottom: 6px; }
    .reset-card input { width: 100%; padding: 12px 14px; border: 1.5px solid #f0e2ea; border-radius: 12px; font-family: inherit; font-size: 14px; margin-bottom: 16px; }
    .reset-card input:focus { outline: none; border-color: #e58bb4; box-shadow: 0 0 0 3px rgba(229,139,180,.18); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px; border-radius: 12px; border: none; background: linear-gradient(135deg,#c75b8c,#b04a74); color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .msg { text-align: center; font-size: 13.5px; min-height: 20px; margin-top: 10px; }
    .msg.err { color: #c0392b; }
    .msg.ok { color: #2e8b57; }
    .back { display: block; text-align: center; margin-top: 18px; color: #b04a74; font-size: 13px; text-decoration: none; }
  </style>
</head>
<body class="reset-page">
  <div class="reset-card">
    <h1>PE_ORIGINALS</h1>
    <p class="sub">Set a new password for your account</p>
    <form id="resetForm">
      <label for="password">New password</label>
      <input type="password" id="password" required minlength="8" placeholder="At least 8 characters" autocomplete="new-password" />
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" required minlength="8" placeholder="Repeat password" autocomplete="new-password" />
      <button type="submit" id="submitBtn">Reset password</button>
      <p class="msg" id="msg"></p>
    </form>
    <a href="index.html" class="back">← Back to store</a>
  </div>

  <script src="js/api.js"></script>
  <script src="js/reset.js"></script>
</body>
</html>
