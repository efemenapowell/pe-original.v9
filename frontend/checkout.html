<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — PE_ORIGINALS</title>
  <meta name="description" content="Secure checkout for PE_ORIGINALS — pre-loved designer fashion for women." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Dancing+Script:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="checkout-page">
  <!-- Simple header -->
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <img src="images/logo.png" alt="PE_ORIGINALS logo" class="brand-logo" onerror="this.style.display='none'" />
        <span class="brand-text">PE_<em>ORIGINALS</em></span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="nav-icons">
        <button class="icon-btn" aria-label="My account" data-open-auth>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" /></svg>
        </button>
        <button class="icon-btn" aria-label="Open shopping bag" data-open-cart>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h12l1.5 13.5h-15L6 7z" /><path d="M9 10V6a3 3 0 016 0v4" /></svg>
          <span class="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Checkout content (rendered by js/checkout-page.js) -->
  <main class="co-page">
    <div class="co-page-head">
      <h1>Checkout</h1>
      <p>Complete your order — it takes less than a minute.</p>
    </div>
    <div id="coPageRoot"><!-- injected --></div>
  </main>

  <!-- Cart drawer (shared) -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="Shopping bag">
    <div class="cart-head">
      <h3>Your Bag <span id="cartCountLabel">0 items</span></h3>
      <button class="cart-close" data-close-cart aria-label="Close cart">×</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-empty" id="cartEmpty">
      <p>Your bag is empty.</p>
      <a href="shop.html" class="btn btn-outline">Shop new pieces</a>
    </div>
    <div class="cart-footer" id="cartFooter">
      <div class="cart-free-ship" id="shipNote"></div>
      <span class="ship-bar"><span id="shipBar"></span></span>
      <div class="cart-total-row"><span>Subtotal</span><span id="cartSubtotal">₦0</span></div>
      <div class="cart-total-row total"><span>Total</span><span class="amount" id="cartTotal">₦0</span></div>
      <button class="btn btn-block" data-checkout>Checkout</button>
    </div>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/api.js"></script>
    <script src="js/settings.js"></script>
  <script src="js/api-bootstrap.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/store-config.js"></script>
  <script src="js/paystack-inline.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/checkout-page.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
